<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>500 — Server Error</title>
	<link rel="stylesheet" href="./css/global.css" />
</head>
<body>
	<main class="error-center container">
		<div class="error-card">
			<h1 class="error-code">500</h1>
			<h2 class="error-title">Something went wrong</h2>
			<p>We're experiencing a server error. The team has been notified — please try again in a few minutes.
			If the problem persists, contact the administrator.</p>

			<div class="error-actions">
				<a href="/" class="btn btn-primary">Return Home</a>
				<a href="javascript:location.reload();" class="btn btn-secondary">Try Again</a>
				<a href="mailto:admin@school.local?subject=500%20on%20site" class="btn">Contact Support</a>
			</div>
		</div>
	</main>

	<footer class="site-footer">
		<div class="container">
			<p>&copy; 2026 School Result Management Portal.</p>
		</div>
	</footer>
</body>
</html>
