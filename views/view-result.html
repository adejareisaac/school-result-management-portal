<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Result · Greenwood Academy</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/view-result.css" />
</head>
<body>
    <!-- Simple public header -->
    <header class="public-header">
        <div class="header-left">
            <span class="logo">🏫 Greenwood Academy</span>
        </div>
        <div class="header-right">
            <a href="/" class="btn btn-outline">← Back to Home</a>
        </div>
    </header>

    <main class="view-result-main">
        <div class="container">
            <h1 class="page-title">Student Result Checker</h1>
            <p class="subtitle">Enter your Student ID and select the session and term to view your result.</p>

            <!-- Search Form -->
            <form id="resultLookupForm" class="lookup-form">
                <div class="form-group">
                    <label for="lookupStudentId">Student ID</label>
                    <input type="text" id="lookupStudentId" placeholder="e.g., STD-2025-001" required />
                </div>
                <div class="form-group">
                    <label for="lookupSession">Academic Session</label>
                    <select id="lookupSession">
                        <option value="2025/2026">2025/2026</option>
                        <option value="2024/2025">2024/2025</option>
                        <option value="2023/2024">2023/2024</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="lookupTerm">Term</label>
                    <select id="lookupTerm">
                        <option value="First">First</option>
                        <option value="Second">Second</option>
                        <option value="Third">Third</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-large">View Result</button>
            </form>

            <!-- Result Display Area -->
            <div id="resultDisplay" style="display:none;">
                <div id="reportCardContainer" class="report-card read-only">
                    <!-- Will be injected by JavaScript -->
                </div>
                <div class="print-actions">
                    <button class="btn btn-secondary" id="printResultBtn">🖨️ Print Result</button>
                </div>
            </div>

            <!-- Error Message -->
            <div id="lookupError" class="error-message" style="display:none;"></div>
        </div>
    </main>

    <footer class="public-footer">
        <p>&copy; 2026 Greenwood Academy. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="/js/app.js"></script>
    <script src="/js/view-result.js" defer></script>
</body>
</html>
