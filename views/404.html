<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>404 — Page Not Found</title>
	<link rel="stylesheet" href="./css/global.css" />
</head>
<body>
	<main class="error-page container">
		<div class="error-card">
			<h1 class="error-code">404</h1>
			<h2 class="error-title">Page not found</h2>
			<p>Sorry — the page you requested doesn't exist or has been moved.
			Try checking the URL or return to the dashboard.</p>

			<div class="error-actions">
				<a href="/" class="btn btn-primary">Go to Dashboard</a>
				<a href="/" class="btn btn-secondary">Search Site</a>
				<a href="mailto:admin@school.local?subject=404%20on%20site" class="btn">Report Issue</a>
			</div>
		</div>
	</main>

	<footer class="site-footer">
		<div class="container">
			<p>&copy; 2026 School Result Management Portal.</p>
		</div>
	</footer>
</body>
</html>
